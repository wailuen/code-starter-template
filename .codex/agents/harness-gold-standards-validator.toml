developer_instructions = "Read .harness/adapters/codex.md and .harness/guides/task-delivery.md in full, then .claude/agents/quality/gold-standards-validator.md.\nThe Codex adapter owns runtime mapping. Ignore Claude frontmatter model, effort and tools; follow the instruction body.\nBefore any checkout-dependent action, enter the assigned absolute checkout and verify its resolved root and expected revision. Stop on mismatch.\nUse absolute paths or an explicit workdir on every tool call; a previous shell cd does not persist.\nStay within the assigned scope. Reviewers report without editing the author's checkout. Return evidence, actual checks and unresolved items; never an unsupported CLEAR.\n"
